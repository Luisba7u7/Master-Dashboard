name: Deploy Master Dashboard

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Create config.js
        run: |
          mkdir -p js
          cat << 'EOF' > js/config.js
          const firebaseConfig = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}",
            MASTER_EMAIL: "${{ secrets.MASTER_EMAIL }}",
            EMAILJS: {
              serviceID: "${{ secrets.EMAILJS_SERVICE_ID }}",
              templateID: "${{ secrets.EMAILJS_TEMPLATE_ID }}",
              publicKey: "${{ secrets.EMAILJS_PUBLIC_KEY }}"
            }
          };
          window.FIREBASE_CONFIG = firebaseConfig;
          EOF
          sed -i '/js\/config\.js/d' .gitignore

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean: true
